========================= -->

<script src="questions.js"></script>



<!-- =========================
     QUIZ SCRIPT
========================= -->

<script>

let currentQuestion = 0;
let score = 0;
let answered = false;


/* =========================
   LOAD QUESTION
========================= */

function loadQuestion() {

    const question =
        mathQuestions[currentQuestion];

    answered = false;


    document.getElementById(
        "question-number"
    ).innerText =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        mathQuestions.length;


    document.getElementById(
        "score"
    ).innerText =
        "Score: " + score;


    document.getElementById(
        "question-text"
    ).innerText =
        question.question;


    const optionsContainer =
        document.getElementById("options");


    optionsContainer.innerHTML = "";


    question.options.forEach(
        function(option, index) {

            const button =
                document.createElement("button");


            button.innerText =
                String.fromCharCode(65 + index) +
                ") " +
                option;


            button.type = "button";


            button.onclick =
                function() {

                    checkAnswer(
                        index,
                        button
                    );

                };


            optionsContainer.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "answer"
    ).innerText = "";


    document.getElementById(
        "next-button"
    ).style.display = "none";


    const progress =
        ((currentQuestion + 1) /
        mathQuestions.length) *
        100;


    document.getElementById(
        "progress-bar"
    ).style.width =
        progress + "%";

}



/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(
    choice,
    clickedButton
) {

    if (answered) {
        return;
    }


    answered = true;


    const question =
        mathQuestions[currentQuestion];


    const answer =
        document.getElementById("answer");


    if (choice === question.answer) {

        score++;


        answer.innerText =
            "✅ Correct! " +
            question.explanation;

    }

    else {

        answer.innerText =
            "❌ Incorrect. " +
            "The correct answer is " +
            String.fromCharCode(
                65 + question.answer
            ) +
            ") " +
            question.options[
                question.answer
            ] +
            ". " +
            question.explanation;

    }


    document.getElementById(
        "score"
    ).innerText =
        "Score: " + score;


    document
        .querySelectorAll(
            "#options button"
        )
        .forEach(
            function(button) {

                button.disabled = true;

            }
        );


    document.getElementById(
        "next-button"
    ).style.display =
        "inline-block";

}



/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion >=
        mathQuestions.length
    ) {

        showResults();

        return;

    }


    loadQuestion();

}



/* =========================
   SHOW RESULTS
========================= */

function showResults() {

    const quizCard =
        document.querySelector(
            "main > .card"
        );


    if (quizCard) {

        quizCard.style.display =
            "none";

    }


    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "final-score"
    ).innerText =
        "You scored " +
        score +
        " out of " +
        mathQuestions.length +
        ".";

}



/* =========================
   RESTART QUIZ
========================= */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    answered = false;


    const quizCard =
        document.querySelector(
            "main > .card"
        );


    if (quizCard) {

        quizCard.style.display =
            "block";

    }


    document.getElementById(
        "result"
    ).style.display =
        "none";


    loadQuestion();

}



/* =========================
   DARK MODE
========================= */

(function () {

    const themeToggle =
        document.getElementById(
            "themeToggle"
        );


    const themeIcon =
        document.getElementById(
            "themeIcon"
        );


    function updateThemeIcon() {

        if (
            !themeToggle ||
            !themeIcon
        ) {
            return;
        }


        const isDark =
            document.body.classList.contains(
                "dark-mode"
            );


        themeIcon.textContent =
            isDark
                ? "☀️"
                : "🌙";


        themeToggle.setAttribute(
            "aria-label",
            isDark
                ? "Switch to light mode"
                : "Switch to dark mode"
        );


        themeToggle.setAttribute(
            "title",
            isDark
                ? "Switch to light mode"
                : "Switch to dark mode"
        );

    }



    /* RESTORE SAVED THEME */

    const savedTheme =
        localStorage.getItem(
            "freeStudyHubTheme"
        );


    if (
        savedTheme === "dark"
    ) {

        document.body.classList.add(
            "dark-mode"
        );

    }


    updateThemeIcon();



    /* TOGGLE THEME */

    if (themeToggle) {

        themeToggle.addEventListener(
            "click",
            function () {

                document.body.classList.toggle(
                    "dark-mode"
                );


                const isDark =
                    document.body.classList.contains(
                        "dark-mode"
                    );


                localStorage.setItem(
                    "freeStudyHubTheme",
                    isDark
                        ? "dark"
                        : "light"
                );


                updateThemeIcon();

            }
        );

    }

})();



/* =========================
   START QUIZ
========================= */

if (
    typeof mathQuestions !== "undefined" &&
    mathQuestions.length > 0
) {

    loadQuestion();

}

else {

    document.getElementById(
        "question-text"
    ).innerText =
        "No questions are available.";

}

</script>

</body>

</html>
